<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💘 Matchmaker Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    input, textarea, select, button {
      width: 100%; padding: 10px; margin: 10px 0;
    }
    .result { background: #f0fff0; border-left: 5px solid #28a745; padding: 15px; margin-top: 20px; }
    h1 { text-align: center; }
  </style>
</head>
<body>

<h1>💍 Groomsmen-Bridesmaids Match Game</h1>

<form onsubmit="event.preventDefault(); findBestMatch();">
  <label>Your Name:</label>
  <input type="text" id="name" required>

  <label>Your Role:</label>
  <select id="role">
    <option value="groom">Groomsman</option>
    <option value="bride">Bridesmaid</option>
  </select>

  <label>Enter your 10 answers (1 per line):</label>
  <textarea id="answers" rows="12" placeholder="E.g.:
Hiking
Introvert
Comedy
Pizza
Dogs
Night owl
Adventure
Beach
Tea
Creative" required></textarea>

  <button type="submit">🔍 Find My Match</button>
</form>

<div class="result" id="matchResult" style="display:none;"></div>
<button onclick="exportPDF()" id="exportBtn" style="display:none;">📄 Export as PDF</button>

<script>
  const participants = {
    groom: [
      { name: "Captain Coolio", answers: ["gaming", "extrovert", "action", "burger", "cats", "early bird", "camping", "mountains", "coffee", "logical"] },
      { name: "Sir Laughsalot", answers: ["stand-up", "introvert", "comedy", "popcorn", "dogs", "night owl", "hiking", "cityscape", "soda", "creative"] }
    ],
    bride: [
      { name: "Lady Sparkle", answers: ["dancing", "extrovert", "romance", "ice cream", "cats", "early bird", "spa", "island", "tea", "emotional"] },
      { name: "Duchess Drama", answers: ["acting", "introvert", "drama", "cake", "dogs", "night owl", "theater", "desert", "wine", "expressive"] }
    ]
  };

  let matchResultData = {};

  function tokenize(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
  }

  function vectorize(answers, vocab) {
    const vec = Array(vocab.length).fill(0);
    answers.forEach(ans => {
      tokenize(ans).forEach(token => {
        const i = vocab.indexOf(token);
        if (i !== -1) vec[i]++;
      });
    });
    return vec;
  }

  function cosineSimilarity(a, b) {
    const dot = a.reduce((sum, val, i) => sum + val * b[i], 0);
    const magA = Math.sqrt(a.reduce((sum, val) => sum + val ** 2, 0));
    const magB = Math.sqrt(b.reduce((sum, val) => sum + val ** 2, 0));
    return dot / (magA * magB || 1);
  }

  function findBestMatch() {
    const name = document.getElementById("name").value.trim();
    const role = document.getElementById("role").value;
    const answers = document.getElementById("answers").value.trim().split("\n").map(a => a.trim()).filter(Boolean);

    if (answers.length !== 10) {
      alert("Please enter exactly 10 answers.");
      return;
    }

    const pool = role === "groom" ? participants.bride : participants.groom;
    const vocab = [...new Set([...answers, ...pool.flatMap(p => p.answers)].flatMap(tokenize))];
    const userVec = vectorize(answers, vocab);

    let bestMatch = null;
    let bestScore = -1;

    for (const person of pool) {
      const theirVec = vectorize(person.answers, vocab);
      const score = cosineSimilarity(userVec, theirVec);
      if (score > bestScore) {
        bestScore = score;
        bestMatch = person;
      }
    }

    matchResultData = {
      yourName: name,
      yourRole: role === "groom" ? "Groomsman" : "Bridesmaid",
      matchName: bestMatch.name,
      matchRole: role === "groom" ? "Bridesmaid" : "Groomsman",
      score: bestScore.toFixed(3)
    };

    document.getElementById("matchResult").style.display = "block";
    document.getElementById("matchResult").innerHTML = `
      💘 <strong>${matchResultData.yourName}</strong> (${matchResultData.yourRole}) is matched with
      <strong>${matchResultData.matchName}</strong> (${matchResultData.matchRole})!
      <br>Compatibility Score: <strong>${matchResultData.score}</strong>
    `;

    document.getElementById("exportBtn").style.display = "inline-block";
  }

  function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(18);
    doc.text("💍 Wedding Match Result", 20, 30);

    doc.setFontSize(14);
    doc.text(`Your Name: ${matchResultData.yourName}`, 20, 50);
    doc.text(`Your Role: ${matchResultData.yourRole}`, 20, 60);
    doc.text(`Matched With: ${matchResultData.matchName}`, 20, 70);
    doc.text(`Their Role: ${matchResultData.matchRole}`, 20, 80);
    doc.text(`Compatibility Score: ${matchResultData.score}`, 20, 90);

    doc.save("match_result.pdf");
  }
</script>

</body>
</html>
