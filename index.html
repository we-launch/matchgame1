<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Match Game</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    .question { margin-bottom: 20px; }
    button { padding: 10px 20px; margin-top: 20px; }
    #result { margin-top: 30px; padding: 20px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Find Your Wedding Match!</h1>
  <form id="quizForm">
    <label>Name: <input type="text" id="userName" required /></label><br /><br />
    <div id="questions"></div>
    <button type="submit">Find My Match</button>
  </form>
  <div id="result"></div>

  <script>
    const questions = [
      "What's your ideal weekend?",
      "Favorite kind of movie?",
      "Pick a vacation:",
      "Choose a snack:",
      "Favorite hobby:",
      "What type of music do you love?",
      "Your spirit animal:",
      "Choose a drink:",
      "Favorite social activity:",
      "What's your love language?"
    ];

    const options = [
      ["Exploring a city", "Gaming", "Music fest", "Reading"],
      ["Romantic", "Action", "Comedy", "Documentary"],
      ["Beach", "Mountains", "Road trip", "Staycation"],
      ["Chips", "Popcorn", "Chocolate", "Fruit"],
      ["Cooking", "Drawing", "Dancing", "Hiking"],
      ["Pop", "Rock", "EDM", "Jazz"],
      ["Cat", "Dog", "Owl", "Sloth"],
      ["Cocktail", "Beer", "Wine", "Mocktail"],
      ["Karaoke", "Board games", "Dancing", "Movie night"],
      ["Words", "Time", "Gifts", "Touch"]
    ];

    const matchProfiles = [
      {
        name: "Jessie",
        nickname: "The Meme Queen",
        role: "Bridesmaid",
        answers: [2, 2, 0, 0, 2, 2, 0, 0, 2, 0],
        description: "Loves a good TikTok, quick with the puns, and always brings snacks."
      },
      {
        name: "Kyle",
        nickname: "The Grillmaster Philosopher",
        role: "Groomsman",
        answers: [1, 1, 3, 0, 0, 1, 1, 1, 0, 1],
        description: "Spouts Aristotle quotes while flipping burgers."
      },
      {
        name: "Lena",
        nickname: "The Romantic DJ",
        role: "Bridesmaid",
        answers: [0, 0, 0, 2, 2, 0, 3, 2, 3, 3],
        description: "Believes in love at first sound...especially when it's a slow jam."
      },
      {
        name: "Rick",
        nickname: "The Conspiracy Theorist DJ",
        role: "Groomsman",
        answers: [1, 3, 1, 1, 3, 1, 2, 3, 1, 1],
        description: "Will debate aliens and drop the bass in the same breath."
      }
    ];

    const questionsContainer = document.getElementById("questions");

    questions.forEach((question, index) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<strong>${question}</strong><br />`;
      options[index].forEach((opt, i) => {
        div.innerHTML += `
          <label>
            <input type="radio" name="q${index}" value="${i}" required /> ${opt}
          </label><br />
        `;
      });
      questionsContainer.appendChild(div);
    });

    document.getElementById("quizForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userAnswers = [];
      for (let i = 0; i < questions.length; i++) {
        const answer = document.querySelector(`input[name='q${i}']:checked`);
        userAnswers.push(parseInt(answer.value));
      }

      const bestMatch = findBestMatch(userAnswers);
      showResult(bestMatch);
    });

    function cosineSimilarity(vecA, vecB) {
      const dot = vecA.reduce((sum, val, i) => sum + val * vecB[i], 0);
      const magA = Math.sqrt(vecA.reduce((sum, val) => sum + val * val, 0));
      const magB = Math.sqrt(vecB.reduce((sum, val) => sum + val * val, 0));
      return dot / (magA * magB);
    }

    function findBestMatch(userAnswers) {
      let bestScore = -1;
      let best = null;
      matchProfiles.forEach(profile => {
        const score = cosineSimilarity(userAnswers, profile.answers);
        if (score > bestScore) {
          bestScore = score;
          best = profile;
        }
      });
      return best;
    }

    function showResult(profile) {
      const name = document.getElementById("userName").value;
      document.getElementById("result").innerHTML = `
        <h2>Hi ${name}!</h2>
        <p>Your best match is:</p>
        <h3>${profile.name} - "${profile.nickname}" (${profile.role})</h3>
        <p>${profile.description}</p>
        <button onclick="window.print()">Download as PDF</button>
      `;
    }
  </script>
</body>
</html>
