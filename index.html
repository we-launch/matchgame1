<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Match-Up</title>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #fff8e1, #fdf4db);
      padding: 20px;
      max-width: 700px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1s ease-in;
    }

    h1 {
      text-align: center;
      color: #d7ad39;
      margin-bottom: 30px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .question {
      background-color: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-left: 5px solid #d7ad39;
      border-radius: 8px;
      animation: fadeIn 0.6s ease-in-out;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #d7ad39;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #b78f2e;
    }

    #result {
      margin-top: 30px;
      padding: 25px;
      border: 2px dashed #d7ad39;
      background-color: #fffdf4;
      border-radius: 10px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    #result h2, #result h3 {
      color: #a17812;
    }

    .icon {
      font-size: 30px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>🎯 Team Match-Up</h1>
  <form id="quizForm">
    <label>Name: <input type="text" id="userName" required /></label>
    <div id="questions"></div>
    <button type="submit">🔍 Find My Match</button>
  </form>
  <div id="result"></div>

  <audio id="matchSound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_ef315f64ca.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>

  <script>
    const questions = [
      "What's your ideal weekend?",
      "Favorite kind of movie?",
      "Pick a vacation:",
      "Choose a snack:",
      "Favorite hobby:",
      "What type of music do you love?",
      "Your spirit animal:",
      "Choose a drink:",
      "Favorite social activity:",
      "What’s your hangout style?"
    ];

    const options = [
      ["Exploring a city", "Gaming", "Music fest", "Reading"],
      ["Romantic", "Action", "Comedy", "Documentary"],
      ["Beach", "Mountains", "Road trip", "Staycation"],
      ["Chips", "Popcorn", "Chocolate", "Fruit"],
      ["Cooking", "Drawing", "Dancing", "Hiking"],
      ["Pop", "Rock", "EDM", "Jazz"],
      ["Cat", "Dog", "Owl", "Sloth"],
      ["Cocktail", "Beer", "Water", "Soda"],
      ["Karaoke", "Board games", "Dancing", "Movie night"],
      ["Chill vibes", "Big energy", "Deep convos", "Let’s play"]
    ];

    const matchProfiles = [
      {
        name: "Jessie",
        nickname: "The Meme Queen",
        answers: [2, 2, 0, 0, 2, 2, 0, 0, 2, 0],
        description: "Master of gifs, lover of silly trivia nights and snack raids."
      },
      {
        name: "Kyle",
        nickname: "The Grillmaster Philosopher",
        answers: [1, 1, 3, 0, 0, 1, 1, 1, 0, 1],
        description: "Quotes Aristotle over burgers and loves deep talks at game night."
      },
      {
        name: "Lena",
        nickname: "The Casual DJ",
        answers: [0, 0, 0, 2, 2, 0, 3, 2, 3, 3],
        description: "Curates the vibe and picks the best playlists for any chill hangout."
      },
      {
        name: "Rick",
        nickname: "The Conspiracy Gamer",
        answers: [1, 3, 1, 1, 3, 1, 2, 3, 1, 1],
        description: "Debates alien life during Mario Kart and snack breaks."
      }
    ];

    const questionsContainer = document.getElementById("questions");

    questions.forEach((question, index) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<strong>🧠 ${question}</strong><br />`;
      options[index].forEach((opt, i) => {
        div.innerHTML += `
          <label>
            <input type="radio" name="q${index}" value="${i}" required /> ${opt}
          </label>`;
      });
      questionsContainer.appendChild(div);
    });

    document.getElementById("quizForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userAnswers = [];
      for (let i = 0; i < questions.length; i++) {
        const answer = document.querySelector(`input[name='q${i}']:checked`);
        userAnswers.push(parseInt(answer.value));
      }

      const bestMatch = findBestMatch(userAnswers);
      showResult(bestMatch);
    });

    function cosineSimilarity(vecA, vecB) {
      const dot = vecA.reduce((sum, val, i) => sum + val * vecB[i], 0);
      const magA = Math.sqrt(vecA.reduce((sum, val) => sum + val * val, 0));
      const magB = Math.sqrt(vecB.reduce((sum, val) => sum + val * val, 0));
      return dot / (magA * magB);
    }

    function findBestMatch(userAnswers) {
      let bestScore = -1;
      let best = null;
      matchProfiles.forEach(profile => {
        const score = cosineSimilarity(userAnswers, profile.answers);
        if (score > bestScore) {
          bestScore = score;
          best = profile;
        }
      });
      return best;
    }

    function showResult(profile) {
      const name = document.getElementById("userName").value;
      document.getElementById("matchSound").play();
      document.getElementById("result").innerHTML = `
        <h2>👋 Hey ${name}!</h2>
        <p>Your vibe-aligned teammate is:</p>
        <h3>🎯 ${profile.name} - "${profile.nickname}"</h3>
        <p>${profile.description}</p>
        <button onclick="window.print()">📄 Save as PDF</button>
      `;
    }
  </script>
</body>
</html>
